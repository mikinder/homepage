<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎉 Juhu, Lasse hat Geburtstag! 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff4fa3;
    --purple: #a855f7;
    --blue: #3aaff5;
    --mint: #4ddfaf;
    --yellow: #ffd447;
    --orange: #ff8c42;
    --deep: #2b1a4a;
    --cream: #fff8ec;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: hidden; }

  body {
    font-family: 'Fredoka', sans-serif;
    background: var(--deep);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Buttons */
  .buttons {
    display: flex;
    gap: 14px;
    padding: 20px 16px;
    justify-content: center;
    width: 100%;
    max-width: 500px;
    flex-shrink: 0;
  }
  .btn {
    flex: 1;
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(1.1rem, 5vw, 1.4rem);
    border: 3px solid var(--deep);
    border-radius: 50px;
    padding: 18px 10px;
    cursor: pointer;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.4);
    line-height: 1.2;
    text-align: center;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    animation: btn-wiggle 2.2s ease-in-out infinite;
    min-height: 64px;
  }
  .btn:active {
    transform: scale(0.93) !important;
    box-shadow: 1px 1px 0 rgba(0,0,0,0.4) !important;
    animation: none !important;
  }
  .btn-fw {
    background: linear-gradient(135deg, var(--yellow), var(--orange));
    color: var(--deep);
    animation-delay: 0s;
  }
  .btn-music {
    background: linear-gradient(135deg, var(--mint), var(--blue));
    color: var(--deep);
    animation-delay: 1.1s;
  }
  @keyframes btn-wiggle {
    0%, 100% { transform: rotate(-1.5deg) scale(1); }
    25%       { transform: rotate(1deg) scale(1.03); }
    75%       { transform: rotate(-2.5deg) scale(1.02); }
  }

  /* Photo */
  .photo-wrap {
    width: 100%;
    max-width: 500px;
    position: relative;
  }
  .photo-wrap img {
    width: 100%;
    height: auto;
    display: block;
    border: 8px solid transparent;
    border-radius: 24px;
    background:
      linear-gradient(#fff, #fff) padding-box,
      linear-gradient(135deg, var(--pink), var(--purple), var(--blue), var(--mint), var(--yellow), var(--orange)) border-box;
    padding: 8px;
  }
  .photo-label {
    margin: 16px auto 0;
    transform: rotate(-2deg);
    background: var(--yellow);
    color: var(--deep);
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(1.15rem, 5vw, 1.5rem);
    padding: 10px 22px;
    border: 3px solid var(--deep);
    border-radius: 50px;
    box-shadow: 4px 4px 0 var(--deep);
    white-space: nowrap;
    width: fit-content;
    animation: label-bob 3s ease-in-out infinite;
  }
  @keyframes label-bob {
    0%, 100% { transform: rotate(-2deg) translateY(0); }
    50%       { transform: rotate(-1deg) translateY(-4px); }
  }
  .joke-card {
    margin: 18px auto 0;
    max-width: 420px;
    background: var(--cream);
    color: var(--deep);
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: clamp(1rem, 4vw, 1.2rem);
    line-height: 1.4;
    text-align: center;
    padding: 16px 22px;
    border: 3px solid var(--deep);
    border-radius: 20px;
    box-shadow: 4px 4px 0 var(--deep);
    transform: rotate(1deg);
  }
  .btn-witz {
    display: block;
    margin: 16px auto 24px;
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(1rem, 4vw, 1.2rem);
    border: 3px solid var(--deep);
    border-radius: 50px;
    padding: 12px 26px;
    cursor: pointer;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.4);
    background: linear-gradient(135deg, var(--pink), var(--purple));
    color: var(--cream);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .btn-witz:active {
    transform: scale(0.93);
    box-shadow: 1px 1px 0 rgba(0,0,0,0.4);
  }

  /* Dancing notes overlay */
  .singer {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .singer.active { opacity: 1; }
  .singer:not(.active) .note-dance { animation-play-state: paused; }
  .note-dance {
    position: absolute;
    top: 0;
    left: 0;
    width: clamp(3.4rem, 13vw, 5rem);
    height: clamp(3.4rem, 13vw, 5rem);
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.9)) drop-shadow(3px 3px 0 rgba(0,0,0,0.5));
  }
  .note-dance.n1 { animation: note-fly-1 1.6s ease-out infinite; }
  .note-dance.n2 { animation: note-fly-2 1.6s ease-out infinite 0.5s; }
  .note-dance.n3 { animation: note-fly-3 1.6s ease-out infinite 1s; }
  @keyframes note-fly-1 {
    0%   { transform: translate(-50%, -50%) scale(0.5) rotate(-15deg); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translate(-50%, -50%) translate(-90px, -110px) scale(1.2) rotate(-25deg); opacity: 0; }
  }
  @keyframes note-fly-2 {
    0%   { transform: translate(-50%, -50%) scale(0.5) rotate(8deg); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translate(-50%, -50%) translate(0, -140px) scale(1.2) rotate(18deg); opacity: 0; }
  }
  @keyframes note-fly-3 {
    0%   { transform: translate(-50%, -50%) scale(0.5) rotate(15deg); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translate(-50%, -50%) translate(90px, -110px) scale(1.2) rotate(25deg); opacity: 0; }
  }

  /* Fireworks canvas */
  #fireworks {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 9999;
    transition: opacity 1.5s ease-out;
  }
  #fireworks.fade { opacity: 0; }

  /* Plane */
  #plane-scene {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9997;
    overflow: hidden;
  }
  .plane-group {
    position: absolute;
    display: flex;
    align-items: center;
    top: 18%;
    left: -640px;
    animation: plane-fly 8s linear 1s forwards, plane-bob 1.4s ease-in-out 1s infinite;
  }
  @keyframes plane-fly {
    0%   { left: -640px; }
    100% { left: calc(100vw + 80px); }
  }
  @keyframes plane-bob {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50%       { transform: translateY(-18px) rotate(1.2deg); }
  }
  .banner-flag {
    background: #fff8ec;
    border: 3px solid var(--deep);
    border-radius: 8px;
    padding: 10px 20px;
    font-family: 'Fredoka', sans-serif;
    font-size: clamp(1.2rem, 4vw, 2rem);
    font-weight: 700;
    color: var(--deep);
    box-shadow: 4px 4px 0 var(--deep);
    white-space: nowrap;
    animation: flag-flap 0.9s ease-in-out 1s infinite;
    transform-origin: right center;
  }
  @keyframes flag-flap {
    0%, 100% { transform: rotate(-1.5deg) skewY(0deg); }
    50%       { transform: rotate(2deg) skewY(1.5deg); }
  }
  .banner-rope {
    width: 60px;
    height: 0;
    border-top: 3px dashed var(--deep);
    flex-shrink: 0;
    opacity: 0.7;
  }
  .propeller {
    transform-box: fill-box;
    transform-origin: center;
    animation: prop-spin 0.22s linear 1s infinite;
  }
  @keyframes prop-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<canvas id="fireworks" aria-hidden="true"></canvas>

<div id="plane-scene" aria-hidden="true">

    <div class="banner-rope"></div>

      <path d="M 100,48 L 160,48 L 172,28 L 16,36 Z" fill="#a855f7" stroke="#2b1a4a" stroke-width="3" stroke-linejoin="round"/>

      <rect x="84" y="48" width="114" height="50" rx="8" fill="#3aaff5" stroke="#2b1a4a" stroke-width="3.5"/>
      <path d="M 196,50 L 228,50 Q 242,50 242,73 Q 242,96 228,96 L 196,96 Z" fill="#4ddfaf" stroke="#2b1a4a" stroke-width="3.5" stroke-linejoin="round"/>
      <rect x="95" y="55" width="38" height="28" rx="5" fill="#fff8ec" stroke="#2b1a4a" stroke-width="2.5"/>
      <rect x="140" y="55" width="38" height="28" rx="5" fill="#fff8ec" stroke="#2b1a4a" stroke-width="2.5"/>
      <rect x="99" y="59" width="11" height="9" rx="2" fill="white" opacity="0.6"/>
      <rect x="144" y="59" width="11" height="9" rx="2" fill="white" opacity="0.6"/>
      <path d="M 15,70 L 10,34 L 54,58 Z" fill="#ff4fa3" stroke="#2b1a4a" stroke-width="3" stroke-linejoin="round"/>

      <line x1="148" y1="97" x2="154" y2="120" stroke="#2b1a4a" stroke-width="4" stroke-linecap="round"/>

      <line x1="106" y1="120" x2="154" y2="120" stroke="#2b1a4a" stroke-width="2" stroke-linecap="round"/>
      <line x1="205" y1="95" x2="204" y2="116" stroke="#2b1a4a" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse cx="203" cy="119" rx="9" ry="5" fill="#2b1a4a"/>

        <ellipse cx="242" cy="59" rx="4.5" ry="13" fill="#2b1a4a" opacity="0.85"/>
        <ellipse cx="242" cy="87" rx="4.5" ry="13" fill="#2b1a4a" opacity="0.85"/>
        <circle cx="242" cy="73" r="7" fill="#ffd447" stroke="#2b1a4a" stroke-width="2.5"/>
      </g>
    </svg>
  </div>
</div>

<div class="buttons">
  <button onclick="startFeuerwerk()" class="btn btn-fw">🎆 Feuerwerk!</button>
  <button id="musik-btn" onclick="toggleMusik()" class="btn btn-music">🎵 Musik an!</button>
</div>

<div class="photo-wrap">
  <img src="lasse.jpg" alt="Lasse">
  <div id="singer" class="singer" aria-hidden="true">
    <svg class="note-dance n1" viewBox="-3 -3 30 30" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
      <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" fill="#ff4fa3" stroke="#2b1a4a" stroke-width="2.2"/>
    </svg>
    <svg class="note-dance n2" viewBox="-3 -3 30 30" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
      <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" fill="#ffd447" stroke="#2b1a4a" stroke-width="2.2"/>
    </svg>
    <svg class="note-dance n3" viewBox="-3 -3 30 30" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
      <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" fill="#3aaff5" stroke="#2b1a4a" stroke-width="2.2"/>
    </svg>
  </div>
</div>

<div id="witz-karte" class="joke-card">❄️ Was ist weiß und sitzt in einem Baum? <br>Ein Kühlschrank auf Klassenfahrt! 😄</div>
<button onclick="naechsterWitz()" class="btn-witz">😂 Anderer Witz!</button>

<audio id="musik" src="song_lasse.mp3" preload="none"></audio>

<script>
  const witze = [
    '❄️ Was ist weiß und sitzt in einem Baum? <br>Ein Kühlschrank auf Klassenfahrt! 😄',
    '🐻 Wie nennt man einen Bären ohne Zähne? <br>Ein Gummibärchen! 😄',
    '🐄 Zwei Kühe stehen auf der Weide. Sagt die eine: "Muh!" <br>Sagt die andere: "Ich wollte gerade dasselbe sagen!" 😄'
  ];
  let witzIndex = 0;
  function naechsterWitz() {
    witzIndex = (witzIndex + 1) % witze.length;
    document.getElementById('witz-karte').innerHTML = witze[witzIndex];
  }

  let _fwGen = 0;
  let _fwCleanup = null;
  function startFeuerwerk() {
    const myGen = ++_fwGen;
    if (_fwCleanup) { _fwCleanup(); _fwCleanup = null; }
    const planeGroup = document.querySelector('.plane-group');
    if (planeGroup) {
      planeGroup.style.animation = 'none';
      void planeGroup.offsetWidth;
      planeGroup.style.animation = '';
    }
    const existing = document.getElementById('fireworks');
    if (existing) existing.remove();
    const canvas = document.createElement('canvas');
    canvas.id = 'fireworks';
    canvas.setAttribute('aria-hidden', 'true');
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function resize() {
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);
    _fwCleanup = () => {
      window.removeEventListener('resize', resize);
      canvas.remove();
      audioCtx.close();
    };
    const COLORS = [
      [255,79,163],[168,85,247],[58,175,245],
      [77,223,175],[255,212,71],[255,140,66],
      [255,94,94],[255,255,255]
    ];
    const rockets = [], particles = [];
    function playBoom(isMega) {
      try {
        const now = audioCtx.currentTime, dur = isMega ? 0.65 : 0.4;
        const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
        osc.frequency.setValueAtTime(isMega ? 65 : 85, now);
        osc.frequency.exponentialRampToValueAtTime(22, now + dur);
        g.gain.setValueAtTime(isMega ? 0.55 : 0.35, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + dur);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + dur);
        const cd = isMega ? 0.45 : 0.28;
        const samples = Math.floor(audioCtx.sampleRate * cd);
        const buf = audioCtx.createBuffer(1, samples, audioCtx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < samples; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource(); noise.buffer = buf;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass'; filter.frequency.value = 900; filter.Q.value = 0.7;
        const ng = audioCtx.createGain();
        ng.gain.setValueAtTime(isMega ? 0.3 : 0.18, now);
        ng.gain.exponentialRampToValueAtTime(0.001, now + cd);
        noise.connect(filter); filter.connect(ng); ng.connect(audioCtx.destination);
        noise.start(now); noise.stop(now + cd);
      } catch(e) {}
    }
    class Rocket {
      constructor(x, targetY, color) {
        this.x = x; this.y = H + 10; this.targetY = targetY;
        this.vy = -(10 + Math.random() * 4);
        this.color = color; this.trail = []; this.dead = false;
      }
      update() {
        this.trail.push({x: this.x, y: this.y});
        if (this.trail.length > 14) this.trail.shift();
        this.y += this.vy; this.vy += 0.12;
        if (this.vy >= 0 || this.y <= this.targetY) { this.explode(); this.dead = true; }
      }
      explode() {
        const isMega = Math.random() < 0.35;
        playBoom(isMega);
        const count = (isMega ? 320 : 200) + Math.floor(Math.random() * 180);
        const rs = (isMega ? 11 : 8) + Math.random() * 5;
        for (let i = 0; i < count; i++) {
          const a = Math.random() * Math.PI * 2;
          const s = rs * (0.15 + Math.pow(Math.random(), 0.6) * 1.6);
          const c = Math.random() < 0.5 ? COLORS[Math.floor(Math.random() * COLORS.length)] : this.color;
          particles.push(new Particle(this.x, this.y, Math.cos(a)*s, Math.sin(a)*s, c, false, isMega));
        }
        const rc = 60 + Math.floor(Math.random() * 40), ring = rs * 1.6;
        for (let i = 0; i < rc; i++) {
          const a = (Math.PI * 2 * i) / rc + (Math.random() - 0.5) * 0.4;
          const s = ring * (0.85 + Math.random() * 0.5);
          particles.push(new Particle(this.x, this.y, Math.cos(a)*s, Math.sin(a)*s, COLORS[Math.floor(Math.random()*COLORS.length)], false, true));
        }
        for (let i = 0; i < 120; i++) {
          const a = Math.random() * Math.PI * 2, s = Math.random() * rs * 1.2;
          particles.push(new Particle(this.x, this.y, Math.cos(a)*s, Math.sin(a)*s, [255,255,255], true));
        }
        if (isMega) {
          const sub = 2 + Math.floor(Math.random() * 3);
          for (let s = 0; s < sub; s++) {
            const a = Math.random() * Math.PI * 2, d = 30 + Math.random() * 80;
            const cx = this.x + Math.cos(a) * d, cy = this.y + Math.sin(a) * d;
            const sc = COLORS[Math.floor(Math.random() * COLORS.length)];
            const sn = 60 + Math.floor(Math.random() * 60), ss = 4 + Math.random() * 3;
            for (let i = 0; i < sn; i++) {
              const ang = Math.random() * Math.PI * 2, sp = ss * (0.3 + Math.random() * 1.2);
              particles.push(new Particle(cx, cy, Math.cos(ang)*sp, Math.sin(ang)*sp, sc));
            }
          }
        }
      }
      draw() {
        for (let i = 0; i < this.trail.length; i++) {
          const t = this.trail[i], alpha = (i / this.trail.length) * 0.9;
          ctx.beginPath();
          ctx.fillStyle = `rgba(${this.color[0]},${this.color[1]},${this.color[2]},${alpha})`;
          ctx.arc(t.x, t.y, 2.4, 0, Math.PI * 2); ctx.fill();
        }
        ctx.beginPath();
        ctx.fillStyle = `rgba(${this.color[0]},${this.color[1]},${this.color[2]},1)`;
        ctx.arc(this.x, this.y, 3.2, 0, Math.PI * 2); ctx.fill();
      }
    }
    class Particle {
      constructor(x, y, vx, vy, color, sparkle = false, big = false) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.color = color;
        this.life = 1; this.decay = 0.006 + Math.random() * 0.018;
        this.size = sparkle ? 1.6 + Math.random() * 0.8 : (big ? 3.5 : 2.8) + Math.random() * 2.2;
        this.sparkle = sparkle; this.wobble = (Math.random() - 0.5) * 0.18;
      }
      update() {
        this.vy += 0.05; this.vx *= 0.985; this.vy *= 0.985;
        this.vx += this.wobble * (Math.random() - 0.5) * 2;
        this.vy += this.wobble * (Math.random() - 0.5) * 2;
        this.x += this.vx; this.y += this.vy; this.life -= this.decay;
      }
      draw() {
        if (this.life <= 0) return;
        const a = Math.max(this.life, 0);
        const flicker = this.sparkle ? (0.5 + Math.random() * 0.5) : 1;
        ctx.beginPath();
        ctx.fillStyle = `rgba(${this.color[0]},${this.color[1]},${this.color[2]},${a * flicker})`;
        ctx.arc(this.x, this.y, this.size * a, 0, Math.PI * 2); ctx.fill();
      }
    }
    function launchRocket() {
      const margin = Math.min(W * 0.08, 60);
      rockets.push(new Rocket(
        margin + Math.random() * (W - margin * 2),
        H * (0.1 + Math.random() * 0.4),
        COLORS[Math.floor(Math.random() * (COLORS.length - 1))]
      ));
    }
    for (let i = 0; i < 28; i++) {
      const delay = 150 + i * 180 + Math.random() * 280;
      setTimeout(launchRocket, delay);
      if (Math.random() < 0.35) setTimeout(launchRocket, delay + Math.random() * 120);
      if (Math.random() < 0.15) setTimeout(launchRocket, delay + Math.random() * 200);
    }
    setTimeout(() => {
      for (let i = 0; i < 12; i++) setTimeout(launchRocket, i * 60 + Math.random() * 100);
    }, 5800);
    let stopAt = performance.now() + 11000;
    function frame() {
      if (myGen !== _fwGen) return;
      ctx.clearRect(0, 0, W, H);
      for (let i = rockets.length - 1; i >= 0; i--) {
        rockets[i].update(); rockets[i].draw();
        if (rockets[i].dead) rockets.splice(i, 1);
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update(); particles[i].draw();
        if (particles[i].life <= 0) particles.splice(i, 1);
      }
      if (performance.now() < stopAt || rockets.length || particles.length) {
        requestAnimationFrame(frame);
      } else {
        canvas.classList.add('fade');
        window.removeEventListener('resize', resize);
        setTimeout(() => { canvas.remove(); audioCtx.close(); }, 1600);
        if (myGen === _fwGen) _fwCleanup = null;
      }
    }
    requestAnimationFrame(frame);
  }

  (function() {
    const musikAudio = document.getElementById('musik');
    const singerEl = document.getElementById('singer');
    if (!musikAudio || !singerEl) return;
    musikAudio.addEventListener('play', () => singerEl.classList.add('active'));
    musikAudio.addEventListener('pause', () => singerEl.classList.remove('active'));
    musikAudio.addEventListener('ended', () => singerEl.classList.remove('active'));
  })();

  function toggleMusik() {
    const audio = document.getElementById('musik');
    const btn = document.getElementById('musik-btn');
    if (!audio) return;
    if (audio.paused) { audio.play(); if (btn) btn.textContent = '🎵 Musik aus!'; }
    else              { audio.pause(); if (btn) btn.textContent = '🎵 Musik an!'; }
  }
</script>
